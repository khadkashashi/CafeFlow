{% extends "base.html" %}
{% block title %}Checkout{% endblock %}

{% block content %}
<h3>Checkout</h3>

<div class="row">
    <div class="col-md-7">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary btn-lg">Place Order</button>
        </form>
    </div>
    <div class="col-md-5">
        <h5>Your Order</h5>
        <table class="table bg-white">
            {% for item in cart %}
            <tr><td>{{ item.food.name }} x{{ item.quantity }}</td><td>Rs.{{ item.line_total }}</td></tr>
            {% endfor %}
            <tr><th>Total</th><th>Rs.{{ cart.total }}</th></tr>
        </table>
    </div>
</div>
{% endblock %}
