{% extends "base.html" %}
{% block title %}Suppliers{% endblock %}

{% block content %}
<h3>Suppliers</h3>
<a href="{% url 'inventory:add_supplier' %}" class="btn btn-primary mb-3">Add Supplier</a>

<table class="table bg-white">
    <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th></th></tr></thead>
    <tbody>
        {% for s in suppliers %}
        <tr>
            <td>{{ s.name }}</td>
            <td>{{ s.phone }}</td>
            <td>{{ s.email }}</td>
            <td>{{ s.address }}</td>
            <td><a href="{% url 'inventory:edit_supplier' s.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="5" class="text-muted">No suppliers yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
