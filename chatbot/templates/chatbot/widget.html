<style>
    #cf-chat-bubble {
        position: fixed; bottom: 24px; right: 24px; z-index: 999;
        width: 56px; height: 56px; border-radius: 50%;
        background: #C17F3E; color: #16110F;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; font-size: 1.4rem; border: none;
        box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    #cf-chat-panel {
        position: fixed; bottom: 90px; right: 24px; z-index: 999;
        width: 320px; max-height: 440px; background: #221B18;
        border-radius: 12px; display: none; flex-direction: column;
        overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        font-family: 'Work Sans', sans-serif;
    }
    #cf-chat-panel.open { display: flex; }
    #cf-chat-header {
        background: #16110F; color: #EFE7DA; padding: 0.8rem 1rem;
        font-weight: 600; font-size: 0.9rem;
    }
    #cf-chat-log {
        flex: 1; overflow-y: auto; padding: 0.8rem; font-size: 0.85rem;
    }
    .cf-msg { margin-bottom: 0.6rem; line-height: 1.4; }
    .cf-msg.user { color: #D99A5C; text-align: right; }
    .cf-msg.bot { color: #EFE7DA; }
    #cf-chat-input-row { display: flex; border-top: 1px solid rgba(140,131,120,0.2); }
    #cf-chat-input {
        flex: 1; background: #2E251F; color: #EFE7DA; border: none;
        padding: 0.7rem; font-size: 0.85rem;
    }
    #cf-chat-send {
        background: #C17F3E; color: #16110F; border: none;
        padding: 0 1rem; font-weight: 600; cursor: pointer;
    }
</style>

<button id="cf-chat-bubble">☕</button>
<div id="cf-chat-panel">
    <div id="cf-chat-header">Ask CafeFlow</div>
    <div id="cf-chat-log">
        <div class="cf-msg bot">Hi! Ask me about our menu, hours, or location.</div>
    </div>
    <div id="cf-chat-input-row">
        <input type="text" id="cf-chat-input" placeholder="Type a message...">
        <button id="cf-chat-send">Send</button>
    </div>
</div>

<script>
(function() {
    const bubble = document.getElementById('cf-chat-bubble');
    const panel = document.getElementById('cf-chat-panel');
    const log = document.getElementById('cf-chat-log');
    const input = document.getElementById('cf-chat-input');
    const sendBtn = document.getElementById('cf-chat-send');

    bubble.addEventListener('click', () => panel.classList.toggle('open'));

    function getCookie(name) {
        const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return match ? match.pop() : '';
    }

    function addMessage(text, role) {
        const div = document.createElement('div');
        div.className = 'cf-msg ' + role;
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    function sendMessage() {
        const message = input.value.trim();
        if (!message) return;
        addMessage(message, 'user');
        input.value = '';

        fetch("{% url 'chatbot:ask' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: JSON.stringify({ message: message }),
        })
        .then(res => res.json())
        .then(data => addMessage(data.reply, 'bot'))
        .catch(() => addMessage("Sorry, something went wrong.", 'bot'));
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
})();
</script>
