<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CafeFlow{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">☕ CafeFlow</span>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'reports:dashboard' %}">Reports</a>
                <a class="nav-link" href="{% url 'orders:pos_screen' %}">POS</a>
                <a class="nav-link" href="{% url 'kitchen:dashboard' %}">Kitchen</a>
                <a class="nav-link" href="{% url 'tables:reception_dashboard' %}">Reception</a>
            </div>
            {% if user.is_authenticated %}
            <span class="navbar-text text-light ms-auto">{{ user.username }} ({{ user.role }})</span>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
