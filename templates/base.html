<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CafeFlow{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">☕ CafeFlow</span>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'landing:home' %}">Home</a>
                <a class="nav-link" href="{% url 'landing:menu' %}">Menu</a>
                <a class="nav-link" href="{% url 'cart:cart_detail' %}">Cart</a>
                <a class="nav-link" href="{% url 'reports:dashboard' %}">Reports</a>
                <a class="nav-link" href="{% url 'orders:pos_screen' %}">POS</a>
                <a class="nav-link" href="{% url 'kitchen:dashboard' %}">Kitchen</a>
                <a class="nav-link" href="{% url 'tables:reception_dashboard' %}">Reception</a>
            </div>
           {% if user.is_authenticated %}
<span class="navbar-text text-light">{{ user.username }} ({{ user.role }})</span>
<form method="post" action="{% url 'logout' %}" class="d-inline ms-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-link nav-link p-0 text-light">Logout</button>
</form>
{% else %}
<a class="nav-link" href="{% url 'login' %}">Login</a>
{% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
</body>
</html>
