{% extends "base.html" %}
{% block title %}Merge Tables{% endblock %}

{% block content %}
<h3>Merge Tables</h3>
{% if messages %}{% for m in messages %}<div class="alert alert-danger">{{ m }}</div>{% endfor %}{% endif %}

<form method="post" style="max-width:400px;">
    {% csrf_token %}
    <label>Merge FROM (draft order, not yet sent)</label>
    <select name="source_table_id" class="form-select mb-3">
        {% for t in tables %}<option value="{{ t.pk }}">Table {{ t.table_number }}</option>{% endfor %}
    </select>
    <label>Merge INTO</label>
    <select name="target_table_id" class="form-select mb-3">
        {% for t in tables %}<option value="{{ t.pk }}">Table {{ t.table_number }}</option>{% endfor %}
    </select>
    <button class="btn btn-primary">Merge</button>
</form>
{% endblock %}
